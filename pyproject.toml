[project]
name = "feedcast"
version = "0.1.0"
description = "Condense a pool of RSS feeds into a narrated audio episode, all on this Mac"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6,<7",
    "feedparser>=6.0.11,<7",
    "trafilatura>=2.0,<3",
    "httpx>=0.28,<1",
    "numpy>=2,<3",
    "num2words>=0.5.13,<0.6",
    # Public MLX port of Laya, pinned to a tested commit.
    # macOS arm64 only; tests stub the judge elsewhere.
    "laya-mlx==0.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio>=0.5.9,<0.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki[en]>=0.9.4,<0.10 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "en-core-web-sm ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[project.scripts]
feedcast = "feedcast.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv.sources]
laya-mlx = { git = "https://github.com/mizorewww/laya-mlx", rev = "0a859518634112655cb97c745dbf04f5191aaf13" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feedcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
