[project]
name = "feedcast"
version = "0.1.0"
description = "Condense a pool of RSS feeds into a narrated audio episode, all on this Mac"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6,<7",
]

[project.scripts]
feedcast = "feedcast.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feedcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
