# The feed pool. Keep it broad: topics are picked from it per episode,
# so feeds don't need to be organized by topic. `name` is the outlet as it should be
# spoken ("reported by ..."); several feeds can share one outlet name, and an outlet
# counts once toward a story's importance.
#
# Every URL here was checked with `feedcast feeds verify` (valid feed, entries with
# titles and links, newest entry under a week old) on 2026-10-13.
# Add more with `feedcast feeds import-opml FILE` or by hand, then run verify.
feeds:
  # World
  - {name: BBC News, url: "https://feeds.bbci.co.uk/news/world/rss.xml"}
